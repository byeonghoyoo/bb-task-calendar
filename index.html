<title>마케팅팀 업무 캘린더 보고</title>
<style>
  :root { color-scheme: dark; --bg: #191919; --panel: #202020; --line: #303030; --text: #ececec; --muted: #a0a0a0; --accent: #6c7cff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; line-height: 1.6; }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 26px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .asof { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  .gate { max-width: 360px; margin: 16vh auto 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
  .gate h1 { font-size: 20px; }
  .gate p { color: var(--muted); font-size: 14px; margin: 6px 0 18px; }
  .gate input { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #474747; background: #141414; color: var(--text); }
  .gate button { margin-top: 12px; width: 100%; padding: 12px; font-size: 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  .gate button:disabled { opacity: .6; cursor: wait; }
  .err { color: #ff8a80; font-size: 14px; min-height: 20px; margin-top: 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-bottom: 34px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  .card h2 { font-size: 15px; margin: 0 0 8px; color: #d6d6d6; }
  .card ul, .card ol { margin: 0; padding-left: 18px; font-size: 14.5px; }
  .card li { margin: 5px 0; }
  h3 { font-size: 19px; margin: 0 0 2px; }
  .note { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .tab { border: 1px solid #5a5a5a; background: #262626; color: var(--text); border-radius: 999px; padding: 8px 16px; font-size: 15px; cursor: pointer; font-family: inherit; }
  .tab:hover { border-color: #8a8a8a; }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .bar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 0 0 8px; }
  .caption { color: #d0d0d0; font-size: 15px; font-weight: 600; }
  .bar a { color: #a9b6ff; font-size: 13px; }
  .shot { width: 100%; display: block; border: 1px solid var(--line); border-radius: 10px; background: #111; }
  .loading { color: var(--muted); font-size: 14px; padding: 40px 0; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
  section + section { margin-top: 40px; }
</style>
</head>
<body>
<div id="gate" class="gate">
  <h1>마케팅팀 업무 캘린더</h1>
  <p>보고용 페이지입니다. 비밀번호를 입력해 주세요.</p>
  <form id="f">
    <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호" autofocus>
    <button id="go" type="submit">열기</button>
  </form>
  <div id="err" class="err"></div>
</div>
<div id="app" class="wrap" hidden></div>

const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
let KEY = null, DATA = null;
const cache = {};
async function keyFrom(pw) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
async function dec(key, bytes) { return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(0, 12) }, key, bytes.slice(12))); }
async function unlock(pw) {
  const k = await keyFrom(pw);
  const plain = await dec(k, b64(CONTENT));
  KEY = k; DATA = JSON.parse(new TextDecoder().decode(plain));
}
async function imgUrl(path) {
  if (cache[path]) return cache[path];
  const r = await fetch(path, { cache: 'no-cache' });
  if (!r.ok) throw new Error('load ' + r.status);
  const u = URL.createObjectURL(new Blob([await dec(KEY, new Uint8Array(await r.arrayBuffer()))], { type: 'image/jpeg' }));
  cache[path] = u; return u;
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
async function fillShot(holder, link, path, alt) {
  holder.replaceChildren(el('div', 'loading', '불러오는 중…'));
  try {
    const u = await imgUrl(path);
    const img = el('img', 'shot'); img.src = u; img.alt = alt;
    holder.replaceChildren(img); link.href = u; link.hidden = false;
  } catch (e) { holder.replaceChildren(el('div', 'loading', '이미지를 불러오지 못했습니다. 새로고침해 주세요.')); }
}
function render() {
  const app = document.getElementById('app');
  app.append(el('h1', '', DATA.title), el('p', 'asof', DATA.asOf));
  const cards = el('div', 'cards');
  for (const c of DATA.cards) {
    const card = el('div', 'card'); card.append(el('h2', '', c.h));
    const list = el(c.type === 'ol' ? 'ol' : 'ul');
    for (const it of c.items) list.append(el('li', '', it));
    card.append(list); cards.append(card);
  }
  app.append(cards);
  const sec = el('section'); sec.append(el('h3', '', DATA.sectionTitle), el('p', 'note', DATA.sectionNote));
  const tabs = el('div', 'tabs'); tabs.setAttribute('role', 'tablist');
  const bar = el('div', 'bar'); const cap = el('span', 'caption'); const open = el('a', '', '크게 보기'); open.target = '_blank'; open.rel = 'noopener'; open.hidden = true; bar.append(cap, open);
  const holder = el('div');
  DATA.tabs.forEach((t, i) => {
    const b = el('button', 'tab', t.name); b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', 'false');
    b.addEventListener('click', () => show(i)); tabs.append(b);
  });
  sec.append(tabs, bar, holder); app.append(sec);
  function show(i) {
    [...tabs.children].forEach((b, j) => b.setAttribute('aria-selected', String(i === j)));
    cap.textContent = DATA.tabs[i].caption; open.hidden = true;
    fillShot(holder, open, DATA.tabs[i].img, DATA.tabs[i].caption);
  }
  show(0);
  if (DATA.example) {
    const ex = el('section'); ex.append(el('h3', '', DATA.example.title));
    const exBar = el('div', 'bar'); const exCap = el('span', 'note', DATA.example.caption); const exOpen = el('a', '', '크게 보기'); exOpen.target = '_blank'; exOpen.rel = 'noopener'; exOpen.hidden = true; exBar.append(exCap, exOpen);
    const exHolder = el('div'); ex.append(exBar, exHolder); app.append(ex);
    fillShot(exHolder, exOpen, DATA.example.img, DATA.example.caption);
  }
  (async () => { for (const t of DATA.tabs) { try { await imgUrl(t.img); } catch (e) {} } })();
}
async function start(pw, silent) {
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; if (!silent) err.textContent = '';
  try {
    await unlock(pw);
    try { sessionStorage.setItem('bbs-report-pw', pw); } catch (e) {}
    document.getElementById('gate').hidden = true; document.getElementById('app').hidden = false; render();
  } catch (e) {
    if (!silent) err.textContent = '비밀번호가 맞지 않습니다.';
    try { sessionStorage.removeItem('bbs-report-pw'); } catch (e2) {}
  } finally { btn.disabled = false; }
}
document.getElementById('f').addEventListener('submit', (e) => { e.preventDefault(); const v = document.getElementById('pw').value.trim(); if (v) start(v, false); });
try { const saved = sessionStorage.getItem('bbs-report-pw'); if (saved) start(saved, true); } catch (e) {}
